[package]
name = "blair"
version = "0.0.7-askama-reboot"
edition = "2024"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
actix-files = "0.6.10"
actix-web = "4.13.0"
askama = { version = "0.16.0", default-features = false, features = ["derive", "std"] }
markdown = "1.0"
env_logger = "0.11.10"
log = "0.4.30"