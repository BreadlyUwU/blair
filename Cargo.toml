[package]
name = "blair"
version = "0.4.0"
edition = "2024"

# [profile.release]
# strip = true
# opt-level = "z"
# lto = true
# codegen-units = 1
# panic = "abort"

[dependencies]
actix-files = "0.7.0"
actix-web = "4.15.0"
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
markdown = "1.0.0"
fs-walk = { version = "0.2.2", features = ["regex"] }
env_logger = "0.11.11"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
yaml_serde = "0.10.7"
chrono = "0.4.45"
atom_syndication = "0.12.10"
rayon = "1.12.0"

[profile.dev]
debug = "line-tables-only"
